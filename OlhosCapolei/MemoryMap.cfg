# =============================================================================
#  CONFIGURAÇÃO HÍBRIDA LO/HI ROM PARA FORÇAR BOOT NO HARDWARE REAL
# =============================================================================
MEMORY
{
    WRAMPAGE:  start = $000000, size = $1000; 
    GAMERAM:   start = $001000, size = $1000; 

    # Criamos os blocos expandidos preenchidos
    ROM0:      start = $008000, size = $8000, fill = yes, fillval = $FF, file = %O;
    ROM1:      start = $018000, size = $8000, fill = yes, fillval = $FF, file = %O;
    
    # Blocos intermediários limpos para esticar a ROM até 512KB
    ROM_REST:  start = $028000, size = $78000, fill = yes, fillval = $FF, file = %O;
}

SEGMENTS
{
    CODE:           load = ROM0, type = ro, align = $100;
    SPRITEDATA:     load = ROM0, type = ro, align = $100;
    
    # Espelhamento Duplo de Segurança:
    # Insere o cabeçalho nas duas posições possíveis que o Everdrive lê
    HEADER:         load = ROM0, start = $00ffc0, type = ro;
    VECTOR:         load = ROM0, start = $00ffe4, type = ro;
    
    # CORREÇÃO: Força o alinhamento de página na GAMERAM para silenciar o ld65
    BSS:            load = GAMERAM, type = bss, optional = yes, align = $100; 
}
