
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OLhos</title>

    <link rel="icon" href="data:,">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            min-height: 100vh;
        }

        h1 {
            margin-bottom: 20px;
        }

        .game-wrapper {
            width: 800px;
            height: 600px;
            max-width: 95vw;
            max-height: 85vh;

            background: black;
            border-radius: 8px;
            overflow: hidden;

            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        #game {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

    <h1>Super Nintendo Player</h1>

    <div class="game-wrapper">
        <div id="game"></div>
    </div>

    <!-- Configuração do EmulatorJS -->
    <script>
        window.EJS_player = "#game";

        window.EJS_core = "snes";

        window.EJS_gameUrl = "./roms/OlhosCapolei.smc";

        window.EJS_pathtodata =
            "https://cdn.emulatorjs.org/stable/data/";

        window.EJS_gameName = "Super Mario World";

        window.EJS_language = "pt-BR";
    </script>

    <!-- Loader oficial do EmulatorJS -->
    <script
        src="https://cdn.emulatorjs.org/stable/data/loader.js">
    </script>

</body>
</html>
